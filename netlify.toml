[build]
  command = "npm run build"
  publish = "."

[functions]
  directory = "netlify/functions"
  included_files = ["content/articles.json"]

[[redirects]]
  from = "/content/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/scripts/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/functions/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/test-*.sh"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/test-*.mjs"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/build-briefings.js"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/build-sitemap.js"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/test-function-bundle.mjs"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/test-scheduled-function.mjs"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/test-schedule.sh"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404"
  status = 404
  force = true
