[build]
  command = "npm run build"
  publish = "."

[functions]
  directory = "netlify/functions"
  included_files = ["content/articles.json"]

[[redirects]]
  from = "/content/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/scripts/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/functions/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/test-*.sh"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/test-*.mjs"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/tests/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/build-analytics.js"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/node_modules/*"
  to = "/404"
  status = 404
  force = true

[[headers]]
  for = "/clients/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/dl/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"
    Cache-Control = "private, no-store"

[[headers]]
  for = "/api/keyring/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex"

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/build-briefings.js"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/build-sitemap.js"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/test-function-bundle.mjs"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/test-scheduled-function.mjs"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/test-schedule.sh"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404"
  status = 404
  force = true

# Site-wide security headers (CSP is report-only until verified against every page)
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy-Report-Only = "object-src 'none'; base-uri 'self'; frame-ancestors 'self'"
